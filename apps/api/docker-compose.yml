services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: keom
      POSTGRES_PASSWORD: keom
      POSTGRES_DB: keom_api
    ports:
      - "5433:5432"
    volumes:
      - keom_api_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keom -d keom_api"]
      interval: 5s
      timeout: 5s
      retries: 10

  # M4: BullMQ backend for delayed opportunity re-evaluation jobs. AOF persistence so
  # scheduled jobs survive a container restart. Port 6380 to avoid clashing with a
  # locally installed Redis, same reasoning as Postgres on 5433.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - keom_api_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  keom_api_postgres:
  keom_api_redis:

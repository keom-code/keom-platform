services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: keom
      POSTGRES_PASSWORD: keom
      POSTGRES_DB: keom_api
    ports:
      - "5433:5432"
    volumes:
      - keom_api_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keom -d keom_api"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  keom_api_postgres:
